<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 118" role="img" aria-label="Incline push-up animation">
<style>
  :root{
    --fg:#111111;
    --rear:#8f98a6;
    --env:#a8b0bc;
    --equip:#4f78c8;
  }
  .fg,.rear,.env,.equip,.head{
    fill:none;
    stroke-linecap:round;
    stroke-linejoin:round;
  }
  .fg{stroke:var(--fg);stroke-width:4}
  .rear{stroke:var(--rear);stroke-width:4}
  .env{stroke:var(--env);stroke-width:1.6;opacity:.9}
  .equip{stroke:var(--equip);stroke-width:3.5}
  .head{stroke:var(--fg);stroke-width:3.5}
</style>

<!-- environment -->
<path class="env" d="M64 105H260"/>
<path class="env" d="M101 72H116"/>
<path class="env" d="M116 72V105"/>

<!-- rear-side limbs -->
<line class="rear" x1="132" y1="67" x2="120" y2="72">
  <animate attributeName="x1" values="132;120;132" dur="2.8s" repeatCount="indefinite"/>
  <animate attributeName="y1" values="67;76;67" dur="2.8s" repeatCount="indefinite"/>
  <animate attributeName="x2" values="120;126;120" dur="2.8s" repeatCount="indefinite"/>
  <animate attributeName="y2" values="72;86;72" dur="2.8s" repeatCount="indefinite"/>
</line>
<line class="rear" x1="120" y1="72" x2="108" y2="72">
  <animate attributeName="x1" values="120;126;120" dur="2.8s" repeatCount="indefinite"/>
  <animate attributeName="y1" values="72;86;72" dur="2.8s" repeatCount="indefinite"/>
</line>
<line class="rear" x1="181" y1="86" x2="229" y2="101">
  <animate attributeName="x1" values="181;175;181" dur="2.8s" repeatCount="indefinite"/>
  <animate attributeName="y1" values="86;91;86" dur="2.8s" repeatCount="indefinite"/>
</line>
<line class="rear" x1="229" y1="101" x2="243" y2="104"/>

<!-- torso -->
<line class="fg" x1="132" y1="67" x2="181" y2="86">
  <animate attributeName="x1" values="132;120;132" dur="2.8s" repeatCount="indefinite"/>
  <animate attributeName="y1" values="67;76;67" dur="2.8s" repeatCount="indefinite"/>
  <animate attributeName="x2" values="181;175;181" dur="2.8s" repeatCount="indefinite"/>
  <animate attributeName="y2" values="86;91;86" dur="2.8s" repeatCount="indefinite"/>
</line>

<!-- foreground arm -->
<line class="fg" x1="132" y1="67" x2="117" y2="70">
  <animate attributeName="x1" values="132;120;132" dur="2.8s" repeatCount="indefinite"/>
  <animate attributeName="y1" values="67;76;67" dur="2.8s" repeatCount="indefinite"/>
  <animate attributeName="x2" values="117;124;117" dur="2.8s" repeatCount="indefinite"/>
  <animate attributeName="y2" values="70;88;70" dur="2.8s" repeatCount="indefinite"/>
</line>
<line class="fg" x1="117" y1="70" x2="106" y2="72">
  <animate attributeName="x1" values="117;124;117" dur="2.8s" repeatCount="indefinite"/>
  <animate attributeName="y1" values="70;88;70" dur="2.8s" repeatCount="indefinite"/>
</line>

<!-- foreground leg -->
<line class="fg" x1="181" y1="86" x2="236" y2="102">
  <animate attributeName="x1" values="181;175;181" dur="2.8s" repeatCount="indefinite"/>
  <animate attributeName="y1" values="86;91;86" dur="2.8s" repeatCount="indefinite"/>
</line>
<line class="fg" x1="236" y1="102" x2="250" y2="104"/>

<circle class="head" cx="134" cy="54" r="10">
  <animate attributeName="cx" values="134;122;134" dur="2.8s" repeatCount="indefinite"/>
  <animate attributeName="cy" values="54;63;54" dur="2.8s" repeatCount="indefinite"/>
</circle>
</svg>