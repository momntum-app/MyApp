<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 160" role="img" aria-label="Bird dog">
<style>
:root{--fg:#111;--pass:#a9adb3;--floor:#c7cbd0}
line,path,circle{vector-effect:non-scaling-stroke}.floor{stroke:var(--floor);stroke-width:2;stroke-linecap:round}.body{stroke:var(--fg);stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}.passive{stroke:var(--pass);stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}.head{stroke:var(--fg);stroke-width:3.5;fill:none}
</style>
<line class="floor" x1="28" y1="132" x2="292" y2="132"/>
<circle class="head" cx="92" cy="70" r="11"/>
<path class="body" d="M105 78 L190 93"/>
<!-- left arm: support -> forward reach -> support -->
<path class="body" d="M124 82 L116 106 L116 132">
  <animate attributeName="d" dur="4.4s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.10;.32;.44;.50;.60;.82;.94;1" keySplines=".33 0 .2 1;.33 0 .2 1;.33 0 .2 1;.33 0 .2 1;.33 0 .2 1;.33 0 .2 1;.33 0 .2 1;.33 0 .2 1" values="M124 82 L116 106 L116 132;M124 82 L116 106 L116 132;M124 82 L86 87 L49 92;M124 82 L86 87 L49 92;M124 82 L116 106 L116 132;M124 82 L116 106 L116 132;M124 82 L116 106 L116 132;M124 82 L116 106 L116 132;M124 82 L116 106 L116 132"/>
</path>
<!-- right arm: support, then reaches in second half -->
<path class="passive" d="M140 84 L146 108 L146 132">
  <animate attributeName="d" dur="4.4s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.10;.32;.44;.50;.60;.82;.94;1" keySplines=".33 0 .2 1;.33 0 .2 1;.33 0 .2 1;.33 0 .2 1;.33 0 .2 1;.33 0 .2 1;.33 0 .2 1;.33 0 .2 1" values="M140 84 L146 108 L146 132;M140 84 L146 108 L146 132;M140 84 L146 108 L146 132;M140 84 L146 108 L146 132;M140 84 L146 108 L146 132;M140 84 L146 108 L146 132;M140 84 L101 89 L63 94;M140 84 L101 89 L63 94;M140 84 L146 108 L146 132"/>
</path>
<!-- left leg: full kneeling leg/shin, then rear extension opposite right arm -->
<path class="body" d="M184 92 L198 119 L224 132">
  <animate attributeName="d" dur="4.4s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.10;.32;.44;.50;.60;.82;.94;1" keySplines=".33 0 .2 1;.33 0 .2 1;.33 0 .2 1;.33 0 .2 1;.33 0 .2 1;.33 0 .2 1;.33 0 .2 1;.33 0 .2 1" values="M184 92 L198 119 L224 132;M184 92 L198 119 L224 132;M184 92 L198 119 L224 132;M184 92 L198 119 L224 132;M184 92 L198 119 L224 132;M184 92 L198 119 L224 132;M184 92 L227 91 L273 95;M184 92 L227 91 L273 95;M184 92 L198 119 L224 132"/>
</path>
<!-- right leg: kneeling -> rear extension opposite left arm -> kneeling -->
<path class="passive" d="M191 95 L205 121 L232 132">
  <animate attributeName="d" dur="4.4s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.10;.32;.44;.50;.60;.82;.94;1" keySplines=".33 0 .2 1;.33 0 .2 1;.33 0 .2 1;.33 0 .2 1;.33 0 .2 1;.33 0 .2 1;.33 0 .2 1;.33 0 .2 1" values="M191 95 L205 121 L232 132;M191 95 L205 121 L232 132;M191 95 L234 95 L278 99;M191 95 L234 95 L278 99;M191 95 L205 121 L232 132;M191 95 L205 121 L232 132;M191 95 L205 121 L232 132;M191 95 L205 121 L232 132;M191 95 L205 121 L232 132"/>
</path>
</svg>