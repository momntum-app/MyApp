<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 130" role="img" aria-labelledby="title">
  <style>
    :root {
      --mom-text: #f6f7fb;
      --mom-muted: #9aa3b8;
      --mom-accent: #4f78c8;
      --mom-card: #0d1a2b;
      color: var(--mom-text);
    }
    .exerciseMotionFloor { stroke: color-mix(in srgb, var(--mom-muted) 42%, transparent); stroke-width: 2; stroke-linecap: round; }
    .exerciseMotionFigure { fill: none; stroke: var(--mom-text); stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    .exerciseMotionJoint { fill: var(--mom-accent); stroke: none; }
    .exerciseMotionHead { fill: color-mix(in srgb, var(--mom-accent) 18%, var(--mom-card)); stroke: var(--mom-text); stroke-width: 4; }
    @media (prefers-color-scheme: light) {
      :root { --mom-text:#172033; --mom-muted:#657188; --mom-card:#ffffff; }
    }
  </style>

  <title id="title">Push-up exercise animation</title>
<g class="exerciseMotionStage">
              <line class="exerciseMotionFloor" x1="28" y1="112" x2="296" y2="112"/>
              <g class="exerciseMotionFigure">
                <!-- head / neck -->
                <circle class="exerciseMotionHead" r="10.5" cx="78" cy="51">
                  <animate attributeName="cy" values="51;51;73;73;51" keyTimes="0;.22;.5;.72;1" dur="3.25s" repeatCount="indefinite"/>
                </circle>
                <line x1="88" y1="56" x2="102" y2="62">
                  <animate attributeName="y1" values="56;56;78;78;56" keyTimes="0;.22;.5;.72;1" dur="3.25s" repeatCount="indefinite"/>
                  <animate attributeName="y2" values="62;62;82;82;62" keyTimes="0;.22;.5;.72;1" dur="3.25s" repeatCount="indefinite"/>
                </line>

                <!-- rigid shoulder-to-hip plank -->
                <line x1="102" y1="62" x2="198" y2="79">
                  <animate attributeName="y1" values="62;62;82;82;62" keyTimes="0;.22;.5;.72;1" dur="3.25s" repeatCount="indefinite"/>
                  <animate attributeName="y2" values="79;79;93;93;79" keyTimes="0;.22;.5;.72;1" dur="3.25s" repeatCount="indefinite"/>
                </line>
                <line x1="198" y1="79" x2="275" y2="105">
                  <animate attributeName="y1" values="79;79;93;93;79" keyTimes="0;.22;.5;.72;1" dur="3.25s" repeatCount="indefinite"/>
                </line>
                <line x1="275" y1="105" x2="290" y2="109"/>

                <!-- far arm, slightly offset for depth -->
                <polyline points="108,64 138,82 130,108" opacity=".42">
                  <animate attributeName="points" values="108,64 138,82 130,108;108,64 138,82 130,108;108,84 139,96 130,108;108,84 139,96 130,108;108,64 138,82 130,108" keyTimes="0;.22;.5;.72;1" dur="3.25s" repeatCount="indefinite"/>
                </polyline>
                <!-- near arm: hand stays planted, elbow folds back -->
                <polyline points="103,64 128,82 116,108">
                  <animate attributeName="points" values="103,64 128,82 116,108;103,64 128,82 116,108;103,84 126,96 116,108;103,84 126,96 116,108;103,64 128,82 116,108" keyTimes="0;.22;.5;.72;1" dur="3.25s" repeatCount="indefinite"/>
                </polyline>

                <!-- hand contact marks -->
                <line x1="109" y1="109" x2="122" y2="109"/>
                <line x1="124" y1="109" x2="136" y2="109" opacity=".42"/>
              </g>
            </g>
</svg>
